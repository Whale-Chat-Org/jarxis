allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true
  '@prisma/engines': true
  prisma: true
# Better Auth bundles unused adapters; this application uses Prisma only.
overrides:
  'better-auth>@better-auth/drizzle-adapter': '-'
  'better-auth>drizzle-orm': '-'
  'better-auth>drizzle-kit': '-'
  # Security fixes for transitive dependencies flagged by Trivy (HIGH, fix available).
  'mysql2': '^3.22.0'
  '@prisma/config>deepmerge-ts': '^8.0.2'
minimumReleaseAgeExclude:
  - '@scalar/client-side-rendering@0.4.8'
  - '@scalar/nextjs-api-reference@0.12.7'
  - '@scalar/schemas@0.12.3'
  - '@scalar/types@0.22.4'
  - '@scalar/validation@0.6.6'
  # pnpm added 5.105.0 during the explicitly requested ncu -u refresh.
  - '@tanstack/query-core@5.104.1 || 5.104.4 || 5.105.0'
  - '@tanstack/react-query@5.104.1 || 5.104.4 || 5.105.0'
  - eslint@10.12.0
  - lucide-react@1.50.0
  # pnpm added these Better Auth releases during the same requested refresh.
  - '@better-auth-ui/core@1.7.32'
  - '@better-auth-ui/react@1.7.32'
  - '@better-auth/core@1.7.13'
  - '@better-auth/kysely-adapter@1.7.13'
  - '@better-auth/memory-adapter@1.7.13'
  - '@better-auth/mongo-adapter@1.7.13'
  - '@better-auth/prisma-adapter@1.7.13'
  - '@better-auth/telemetry@1.7.13'
  - better-auth@1.7.13
