# Local-only services and host-bound ports. Use with -f compose.yaml -f compose.dev.yaml.
services:
  postgres:
    ports: ['127.0.0.1:${POSTGRES_PORT:-55432}:5432']
  redis:
    ports: ['127.0.0.1:${REDIS_PORT:-56379}:6379']
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: [azurite-blob, --blobHost, 0.0.0.0, --location, /data, --skipApiVersionCheck]
    ports: ['127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000']
    volumes: [azurite-data:/data]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:10000/devstoreaccount1').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: { target: tools }
    command: pnpm dev --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    depends_on:
      azurite: { condition: service_healthy }
volumes:
  azurite-data:
