# Local-only services and host-bound ports. Use with -f compose.yaml -f compose.dev.yaml.
services:
  postgres:
    ports: ['127.0.0.1:${POSTGRES_PORT:-55432}:5432']
  redis:
    ports: ['127.0.0.1:${REDIS_PORT:-56379}:6379']
  mailpit:
    image: axllent/mailpit:v1.29.2@sha256:030f06031ce5c60913ac9363da1ab0d4be6fd2a78147dd0e1ca0fcac665d6b34
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: [azurite-blob, --blobHost, 0.0.0.0, --location, /data, --skipApiVersionCheck]
    ports: ['127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000']
    volumes: [azurite-data:/data]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:10000/devstoreaccount1').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: { target: tools }
    command: pnpm dev --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    depends_on:
      mailpit: { condition: service_started }
      azurite: { condition: service_healthy }
volumes:
  azurite-data:
