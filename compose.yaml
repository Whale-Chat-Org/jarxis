name: jarxis
x-app-env: &app-env
  DATABASE_URL: postgresql://jarxis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-jarxis}
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  BREVO_API_KEY: ${BREVO_API_KEY:?Set BREVO_API_KEY in .env}
  MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM to a Brevo-verified sender in .env}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  ML_ENCRYPTION_KEY: ${ML_ENCRYPTION_KEY:?Set ML_ENCRYPTION_KEY to an independent 64-character hex key}
  ML_CODEX_OAUTH_CLIENT_ID: ${ML_CODEX_OAUTH_CLIENT_ID:-}
  ML_CLAUDE_OAUTH_CLIENT_ID: ${ML_CLAUDE_OAUTH_CLIENT_ID:-}
services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: jarxis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jarxis}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U jarxis -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:latest
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: { context: ., target: tools }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
  ml-worker:
    build:
      context: .
      target: worker
      args:
        CODEX_CLI_VERSION: ${ML_CODEX_CLI_VERSION:-0.160.0}
        CLAUDE_CLI_VERSION: ${ML_CLAUDE_CLI_VERSION:-2.1.288}
    environment: *app-env
    volumes: [ml-worker-state:/var/lib/jarxis-ml]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    init: true
    stop_grace_period: 40s
    restart: unless-stopped
  app:
    build: { context: ., target: runner }
    environment:
      <<: *app-env
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:?Set AZURE_STORAGE_CONNECTION_STRING in .env}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-profile-photos}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  ml-worker-state:
